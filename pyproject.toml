[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sochiera-homepage"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["Jinja2==3.1.6", "Markdown==3.8.2", "cryptography==46.0.5", "fastapi==0.162.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx2==2.16.0"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
