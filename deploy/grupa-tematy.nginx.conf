# Include inside the existing HTTPS server block, before location /.
# The existing document root serves the static page and route-scoped assets.
location ^~ /grupa-tematy/ {
    try_files $uri $uri/ =404;
}

location ^~ /api/grupa-tematy/ {
    client_max_body_size 4k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:8793;
}
